name: CI

on:
  push:
    branches: [master]
  pull_request:

# Runs queue, the trees and the cargo target dir below are shared.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The runner exports CI_STATE, a directory it keeps between jobs.
env:
  CARGO_TARGET_DIR: ${{ env.CI_STATE }}/target

jobs:
  rust:
    runs-on: aasgard
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop .#ci -c bash -e {0}
        working-directory: ${{ env.CI_STATE }}/rust
    steps:
      - name: checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git init -q "$CI_STATE/rust" && cd "$_"
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qfB ci FETCH_HEAD
          git clean -qfdx
      - name: rustfmt
        run: cargo fmt --check --manifest-path compositor/Cargo.toml
      - name: clippy
        run: |
          cargo clippy --manifest-path compositor/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path compositor/Cargo.toml --all-targets --features screencast -- -D warnings
      - name: tests
        env:
          PROPTEST_CASES: 256
        run: cargo nextest run --manifest-path compositor/Cargo.toml --profile rust
  emacs:
    name: ${{ matrix.variant }}
    runs-on: aasgard
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [pgtk, pwayl]
    defaults:
      run:
        working-directory: ${{ env.CI_STATE }}/${{ matrix.variant }}
    steps:
      - name: checkout
        working-directory: ${{ github.workspace }}
        run: |
          git init -q "$CI_STATE/${{ matrix.variant }}" && cd "$_"
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -qfB ci FETCH_HEAD
          git clean -qfdx
      - name: nix build
        run: nix build -L .#checks.x86_64-linux.ewm-${{ matrix.variant }}
      - name: session
        run: nix run -L .#session-test-${{ matrix.variant }}
      # Last, the rust job may still hold the cargo lock.
      - name: tests
        shell: nix develop .#ci-${{ matrix.variant }} -c bash -e {0}
        run: cargo nextest run --manifest-path compositor/Cargo.toml --profile emacs
